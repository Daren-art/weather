version: "3.9"

services:
  app:
    build: .
    container_name: fastapi_app
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./static:/app/static

  nginx:
    image: nginx:latest
    container_name: nginx_server
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static
    depends_on:
      - app